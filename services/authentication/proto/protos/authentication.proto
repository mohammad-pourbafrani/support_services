syntax = "proto3";

package authentication;

option go_package = "./";


service AuthenticationService{
    rpc SignIn (SigninRequest) returns (SigninResponse);
}

message SigninRequest{
    string phoneNumber = 1;
    string passWord = 2;
}

message SigninResponse{
    UserInfo data = 1;
    string message = 2;
}

message UserInfo{
    string phoneNumber =1;
    string userId=2;
    string userRole=3;
    string userStatus=4;
}